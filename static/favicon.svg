<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle / Rounded Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Biometric Corner Reticles -->
  <path d="M 12 20 L 12 12 L 20 12" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M 52 20 L 52 12 L 44 12" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M 12 44 L 12 52 L 20 52" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M 52 44 L 52 52 L 44 52" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Biometric Scanning Face Oval Target -->
  <ellipse cx="32" cy="32" rx="13" ry="16" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Central Electric Lightning Pulse Symbol -->
  <path d="M 34 18 L 25 32 L 31 32 L 28 46 L 39 30 L 33 30 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
</svg>
